name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install web dependencies and sync the Android project
        working-directory: app
        run: |
          npm ci
          npx cap sync android
      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../build.log
      - name: Publish the APK to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk HaydayTracker.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest HaydayTracker.apk --title "Hayday Tracker for Android" --notes "Download HaydayTracker.apk on your phone and install it. Build ${{ github.run_number }}."
      - name: Keep the build log (only when the build fails)
        if: failure()
        run: |
          git config user.name "build-bot" && git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan buildlog && git rm -rf . >/dev/null 2>&1 || true
          tail -n 300 build.log > build-failure.log 2>/dev/null || echo "no log" > build-failure.log
          git add build-failure.log && git commit -m "build log" && git push -f origin buildlog
